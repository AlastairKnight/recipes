<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recipe Box</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#c1502e">
<style>
  :root {
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --text: #2b2420;
    --muted: #8a7f74;
    --accent: #c1502e;
    --border: #ece5db;
    --shadow: 0 1px 2px rgba(43,36,32,0.06), 0 4px 16px rgba(43,36,32,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1815;
      --card-bg: #262019;
      --text: #f2ece3;
      --muted: #a89a8a;
      --accent: #e2764a;
      --border: #38312a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1815;
    --card-bg: #262019;
    --text: #f2ece3;
    --muted: #a89a8a;
    --accent: #e2764a;
    --border: #38312a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  header {
    padding: 40px 20px 20px;
    max-width: 1200px;
    margin: 0 auto;
  }
  h1 {
    font-size: 28px;
    margin: 0 0 4px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 20px;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  #search {
    flex: 1 1 240px;
    min-width: 0;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
  }
  #search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  .author-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 20px 60px;
  }

  .count {
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0 16px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
  }

  a.card {
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.card:hover {
    transform: translateY(-3px);
    box-shadow: 0 2px 4px rgba(43,36,32,0.1), 0 8px 24px rgba(43,36,32,0.12);
  }

  .thumb {
    aspect-ratio: 4 / 3;
    width: 100%;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .thumb.placeholder {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }

  .card-body {
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }
  .card-title {
    font-size: 14.5px;
    font-weight: 600;
    line-height: 1.3;
  }
  .card-author {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Recipe Box</h1>
  <p class="subtitle" id="subtitle">Loading recipes…</p>
  <div class="controls">
    <input type="text" id="search" placeholder="Search recipes…" autocomplete="off">
    <div class="author-filters" id="authorFilters"></div>
  </div>
</header>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No recipes match your search.</div>
</main>

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const subtitle = document.getElementById('subtitle');
  const searchInput = document.getElementById('search');
  const authorFiltersEl = document.getElementById('authorFilters');

  subtitle.textContent = RECIPES.length + ' recipes, ready to cook';

  const authors = Array.from(new Set(RECIPES.map(r => r.author))).sort();
  let activeAuthor = 'All';

  function encodePath(path) {
    return path.split('/').map(encodeURIComponent).join('/');
  }

  function initials(title) {
    return title
      .split(/\s+/)
      .filter(Boolean)
      .slice(0, 3)
      .map(w => w[0])
      .join('')
      .toUpperCase();
  }

  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = RECIPES.filter(r => {
      const matchesAuthor = activeAuthor === 'All' || r.author === activeAuthor;
      const matchesQuery = !q || r.title.toLowerCase().includes(q) || r.author.toLowerCase().includes(q);
      return matchesAuthor && matchesQuery;
    });

    countEl.textContent = filtered.length === RECIPES.length
      ? filtered.length + ' recipes'
      : filtered.length + ' of ' + RECIPES.length + ' recipes';

    grid.innerHTML = '';
    empty.style.display = filtered.length ? 'none' : 'block';

    for (const r of filtered) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = encodePath(r.file);

      const thumb = document.createElement('div');
      if (r.img) {
        thumb.className = 'thumb';
        const img = document.createElement('img');
        img.src = encodePath(r.img);
        img.alt = r.title;
        img.loading = 'lazy';
        thumb.appendChild(img);
      } else {
        thumb.className = 'thumb placeholder';
        thumb.textContent = initials(r.title);
      }

      const body = document.createElement('div');
      body.className = 'card-body';
      const authorEl = document.createElement('div');
      authorEl.className = 'card-author';
      authorEl.textContent = r.author;
      const titleEl = document.createElement('div');
      titleEl.className = 'card-title';
      titleEl.textContent = r.title;
      body.appendChild(authorEl);
      body.appendChild(titleEl);

      a.appendChild(thumb);
      a.appendChild(body);
      grid.appendChild(a);
    }
  }

  function renderFilters() {
    authorFiltersEl.innerHTML = '';
    const all = ['All', ...authors];
    for (const author of all) {
      const chip = document.createElement('button');
      chip.className = 'chip' + (author === activeAuthor ? ' active' : '');
      chip.textContent = author;
      chip.addEventListener('click', () => {
        activeAuthor = author;
        renderFilters();
        render();
      });
      authorFiltersEl.appendChild(chip);
    }
  }

  searchInput.addEventListener('input', render);

  renderFilters();
  render();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
